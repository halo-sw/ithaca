# Stage 30a: from a fresh clone, `docker compose up` runs the same app
# as the public site. Keys come from an optional `.env` file at the
# repo root (see .env.example); every value below is a ${...} reference
# so no key text ever lives in this file. With no `.env`, both services
# still start: the chat runs in rule mode and the map falls back as the
# public site does.
services:
  web:
    build:
      context: .
      target: web
      args:
        VITE_API_BASE: ${VITE_API_BASE:-http://localhost:8787}
    ports:
      - "8080:8080"
    depends_on:
      - relay
  relay:
    build:
      context: .
      target: relay
    ports:
      - "8787:8787"
    env_file:
      - path: .env
        required: false
    environment:
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080}
      META_API_KEY: ${META_API_KEY:-}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      BASETEN_API_KEY: ${BASETEN_API_KEY:-}
      VWORLD_KEY: ${VWORLD_KEY:-}
      HOUSING_API_KEY: ${HOUSING_API_KEY:-}
      DATA_BASE_URL: ${DATA_BASE_URL:-}
      PORT: "8787"
